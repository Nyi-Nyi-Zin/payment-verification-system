services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-verification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_verification
      POSTGRES_USER: payment_verification
      POSTGRES_PASSWORD: payment_verification
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: payment-verification-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
